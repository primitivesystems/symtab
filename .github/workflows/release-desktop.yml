name: Release desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(bun -e 'console.log(require("./apps/desktop/package.json").version)')" = "$GITHUB_REF_NAME"

      - run: bun install --frozen-lockfile

      - name: Build unsigned DMG and publish
        run: |
          bun --cwd apps/desktop run release
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" apps/desktop/release/*.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
