name: Release desktop

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  macos:
    if: startsWith(github.event.release.target_commitish, 'release/')
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      TARGET_BRANCH: ${{ github.event.release.target_commitish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Verify release branch, tag, and package version match
        shell: bash
        run: |
          [[ "$TARGET_BRANCH" =~ ^release/.+-v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          VERSION="${BASH_REMATCH[1]}"
          test "$RELEASE_TAG" = "v$VERSION"
          test "$VERSION" = "$(bun -e 'console.log(require("./apps/desktop/package.json").version)')"

      - run: bun install --frozen-lockfile

      - name: Build unsigned DMG
        run: bun --cwd apps/desktop run release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Attach DMG to the GitHub release
        run: |
          gh release upload "$RELEASE_TAG" apps/desktop/release/*.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
