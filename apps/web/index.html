<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>Symtab - Personal Knowledge Management</title>
    <link rel="icon" type="image/png" href="/symtab.png" />
    <link rel="apple-touch-icon" href="/symtab.png" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      .flux-startup {
        display: grid;
        height: 100%;
        place-items: center;
        background: #f9f9f9;
        color: #2e2e2e;
        font:
          13px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .flux-startup > div {
        display: grid;
        justify-items: center;
        gap: 12px;
      }
      .flux-startup-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #b8b8b8;
        border-top-color: currentColor;
        border-radius: 999px;
        animation: flux-spin 0.8s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        .flux-startup {
          background: #242424;
          color: #ededed;
        }
        .flux-startup-spinner {
          border-color: #555;
          border-top-color: currentColor;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .flux-startup-spinner {
          animation: none;
        }
      }
      @keyframes flux-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="flux-startup" role="status" aria-live="polite">
        <div>
          <span class="flux-startup-spinner" aria-hidden="true"></span><span>Starting Symtab</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
