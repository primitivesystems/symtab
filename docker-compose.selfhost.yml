# Flux — Self-Hosted Deployment
#
# Usage:
#   cp .env.selfhost .env
#   # Follow docs/self-hosting.md for credentials and HTTPS.
#   docker compose -f docker-compose.selfhost.yml up -d
#
# Update:
#   docker compose -f docker-compose.selfhost.yml pull
#   docker compose -f docker-compose.selfhost.yml up -d --build
#
# Back up both volumes with the server stopped; see docs/self-hosting.md.

name: flux-selfhost

services:
  # ── Go API backend ─────────────────────────────────────────────────────────
  flux-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flux-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: 8080
      FLUX_VAULT_ROOT: /data/vaults
      FLUX_APP_DATA_DIR: /data/appdata
      FLUX_SETUP_KEY: ${FLUX_SETUP_KEY:-}
      # Set CORS to the public URL so the Nginx container can call the API
      CORS_ALLOWED_ORIGIN: ${PUBLIC_URL:-http://localhost:3000}
      # Plugin registry (optional — leave blank to disable marketplace)
      FLUX_PLUGIN_REGISTRY_URL: ${FLUX_PLUGIN_REGISTRY_URL:-}
      FLUX_PLUGIN_REGISTRY_SIGNATURE_URL: ${FLUX_PLUGIN_REGISTRY_SIGNATURE_URL:-}
      FLUX_PLUGIN_REGISTRY_PUBLIC_KEY: ${FLUX_PLUGIN_REGISTRY_PUBLIC_KEY:-}
    volumes:
      - flux-vaults:/data/vaults
      - flux-appdata:/data/appdata
    networks:
      - flux-internal
    # Not exposed to the host directly — Nginx proxies /api/* to it
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── React/Vite web frontend served by Nginx ────────────────────────────────
  flux-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: flux-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    networks:
      - flux-internal
    depends_on:
      flux-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  flux-vaults:
    driver: local
  flux-appdata:
    driver: local

# ── Internal bridge network ────────────────────────────────────────────────────
networks:
  flux-internal:
    driver: bridge
