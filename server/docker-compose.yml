services:
  server:
    build: .
    container_name: symtab-server
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: development
      HOST: 0.0.0.0
      SYMTAB_VAULT_ROOT: /data/vaults
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
    volumes:
      - vaults:/data/vaults
    restart: unless-stopped

volumes:
  vaults:
